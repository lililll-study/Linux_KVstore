# 主节点配置
role=master
master_port=2000
master_ip=192.168.137.139
# snap全量同步
snap.enable=true
# aof增量同步：从节点一般不启动aof
aof.enable=false
# aof全文CRC校验开关
aof.crc=false
# RDMA开关：开启后SNAP文件和aof的初次数据同步走RDMA
rdma.enable=true
# eBPF开关：开启后aof的增量数据通过bpf捕获
ebpf.enable=true
# 内存泄漏检测：仅调试诊断用（有额外内存和性能开销）
leak.enable=false
# 日志级别：debug/info/warn/error/fatal（也可用数字0-4）
log.level=debug