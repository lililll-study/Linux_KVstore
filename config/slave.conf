# 从节点配置
role=slave
slave_port=2001
slave_ip=192.168.137.140
master_ip=192.168.137.139
master_port=2000
#从机可以不开启持久化功能
# snap快照同步
snap.enable=true
# 从节点一般不启动aof
aof.enable=false
# RDMA功能开关
rdma.enable=true
# eBPF 实时捕获转发（需要 sudo 启动）
ebpf.enable=true
# 日志级别：debug/info/warn/error/fatal（也可用数字0-4）
log.level=debug